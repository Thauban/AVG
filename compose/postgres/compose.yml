services:
  db:
    image: dhi.io/postgres:18.3-debian13
    ports:
      - published: 5432
        target: 5432
    command: ["-c", "ssl=on"]
    volumes:
      - avg_data:/var/lib/postgresql/18/data
      - avg_tablespace:/tablespace
      - avg_init:/init:ro
    environment:
      TZ: Europe/Berlin
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      POSTGRES_INITDB_ARGS: "--auth-local=scram-sha-256 --auth-host=scram-sha-256"
    secrets: [db_password]
    networks: [acme-network]
    user: "postgres:postgres"
    hostname: postgres
    container_name: postgres
    cap_drop: [ALL]
    healthcheck:
      test: [CMD, pg_isready, --dbname=postgres, --username=postgres]
      interval: 5s
      timeout: 2s
      retries: 2
      start_period: 5s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 768M
        reservations:
          cpus: "0.5"
          memory: 512M

# /run/secrets/*
secrets:
  db_password:
    file: ./pw.txt

volumes:
  avg_data:
    name: avg_data
    external: true
  avg_tablespace:
    name: avg_tablespace
    external: true
  avg_init:
    name: avg_init
    external: true

networks:
  acme-network:
    name: acme-network
